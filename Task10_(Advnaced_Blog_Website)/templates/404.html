{% extends "base.html" %}

{% block title %}Page Not Found | My Premium Blog{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-gradient-soft mb-3">404</div>
  <h1 class="h3 fw-semibold mb-3">Page not found</h1>
  <p class="text-muted mb-4">
    The page you’re looking for doesn’t exist or may have been moved.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">
    Back to Home
  </a>
</div>
{% endblock %}
